services:
  redis:
    image: "redis:latest"
    container_name: redis_service
    restart: unless-stopped
    tty: true
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--requirepass", "${REDIS_ROOT_PASSWORD}"]
    environment:
      REDISCLI_AUTH: "${REDIS_ROOT_PASSWORD}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - spending-tracker-network

  mysql:
    image: "mysql:latest"
    container_name: mysql_service
    restart: unless-stopped
    tty: true
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_NAME}"
    healthcheck:
      test: ["CMD-SHELL", "mysql --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --database=\"$${MYSQL_DATABASE}\" --execute='SELECT 1' >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 20s
    ports:
      - "33070:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - spending-tracker-network

  spending_tracker_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spending_tracker_api
    restart: unless-stopped
    ports:
      - "9000:8000"
    env_file:
      - .env
    volumes:
      - /app/.venv
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=mysql
      - DB_PORT=3306
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - spending-tracker-network
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          initial_sync: true
          ignore:
            - .git/
            - .venv/
            - .env
            - __pycache__/

volumes:
  redis_data:
  mysql_data:

networks:
  spending-tracker-network:
    driver: bridge